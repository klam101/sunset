<svg xmlns="http://w3.org" viewBox="0 0 35 35" width="35" height="35">
  <defs>
    <!-- Strata Layer Gradients (From top to bottom of your image) -->
    <linearGradient id="topRidge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE19C" />
      <stop offset="100%" stop-color="#F28E5B" />
    </linearGradient>
    
    <linearGradient id="midRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E87653" />
      <stop offset="100%" stop-color="#D94E34" />
    </linearGradient>

    <linearGradient id="baseRidge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B83A26" />
      <stop offset="100%" stop-color="#802219" />
    </linearGradient>

    <!-- Mask to trim the layered wavy ribbons into a perfect circular sun -->
    <mask id="sunCircleMask">
      <circle cx="17.5" cy="17.5" r="14" fill="#FFFFFF" />
    </mask>
  </defs>

  <!-- The Sun Object (Masked to maintain a clean circular edge) -->
  <g mask="url(#sunCircleMask)">
    <!-- LAYER 1: Top Sky/Ridge Glow (Fills the upper crest) -->
    <rect x="0" y="0" width="35" height="35" fill="url(#topRidge)" />

    <!-- LAYER 2: Middle Luminous Terracotta Wave -->
    <path d="M 0 11 C 8 8, 18 14, 26 10 C 30 8, 33 10, 35 9 L 35 35 L 0 35 Z" fill="url(#midRidge)" />

    <!-- LAYER 3: Deep Base Crimson Ribbon -->
    <path d="M 0 19 C 7 21, 15 17, 24 21 C 29 23, 32 20, 35 22 L 35 35 L 0 35 Z" fill="url(#baseRidge)" />

    <!-- Sharp Internal Keylines (Creating the clean woodblock separation gaps) -->
    <path d="M -2 11 C 6 8, 18 14, 26 10 C 30 8, 33 10, 37 9" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
    <path d="M -2 19 C 5 21, 15 17, 24 21 C 29 23, 32 20, 37 22" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
  </g>
</svg>
