<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Modern Finance Gradient: Warm Sunset to Trustworthy Slate -->
    <linearGradient id="sunsetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D94E34" />
      <stop offset="50%" stop-color="#F28E5B" />
      <stop offset="100%" stop-color="#FCE19C" />
    </linearGradient>

    <!-- Professional Slate/Navy for Typography -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2530" />
      <stop offset="100%" stop-color="#11161D" />
    </linearGradient>
  </defs>

  <!-- BRAND TYPOGRAPHY (Right Aligned) -->
  <!-- Note: Uses system-safe fallback fonts ideal for clean UI banking integration -->
  <g id="logo-text" transform="translate(370, 185)">
    <!-- Main Brand Name -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="92" 
          font-weight="800" 
          letter-spacing="-2px" 
          fill="url(#textGrad)">sunset</text>
          
    <!-- Dot/Period Accent using the Sunset Palette to anchor the tech look -->
    <circle cx="282" cy="-14" r="14" fill="#D94E34" />

    <!-- Sub-branding/Industry Identifier -->
    <text x="5" y="42" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="24" 
          font-weight="500" 
          letter-spacing="8px" 
          fill="#6C7A89" 
          opacity="0.9">BANKING &amp; TECH</text>
  </g>
</svg>
